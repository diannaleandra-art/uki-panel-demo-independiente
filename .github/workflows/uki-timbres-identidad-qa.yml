name: Uki QA · timbres e identidad de clientes
on:
  push:
    branches:
      - qa/uki-timbres-datos-cliente-sin-whatsapp-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/uki-timbres-cliente-identidad-20261108.test.cjs
      - run: node --test tests/uki-archivo-rechazados-cierre-claro-20261108.test.cjs
      - run: node --test tests/uki-delivery-manual-caja-20261108.test.cjs
