name: Romo catálogo QA - sin despliegue
on:
  push:
    branches:
      - qa/romo-catalogo-inventario-sin-publicar-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pruebas de catálogo e inventario Romo sin datos reales
        run: node --test tests/romo-catalogo-integracion-qa.test.mjs tests/romo-inventario-integracion-qa.test.mjs tests/romo-mismo-panel-qa.test.cjs tests/romo-panel-proyeccion-qa.test.mjs tests/romo-carta-panel-vista-qa.test.cjs tests/romo-catalogo-api-edicion-qa.test.cjs tests/romo-catalogo-anterior-qa.test.mjs tests/romo-inventario-ui-qa.test.cjs tests/romo-ingresos-igual-uki-qa.test.mjs tests/romo-pin-trabajadores-qa.test.cjs
