    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Probar corrección panel de dueños y preservación de manuales
        run: node --test tests/uki-duenos-sin-consulta-manual-20261109.test.cjs
