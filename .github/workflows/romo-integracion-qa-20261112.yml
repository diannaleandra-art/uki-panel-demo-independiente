            tests/romo-estado-operativo-qa.test.mjs \
            tests/romo-estado-api-cerrada-qa.test.mjs \
            tests/romo-solicitudes-carta-qa.test.mjs \
            tests/uki-romo-recepcion-formulario-qa.test.mjs \
            tests/uki-romo-guardado-atomico-qa.test.mjs \
            tests/uki-romo-pedido-formato-qa.test.mjs \
            tests/uki-romo-flujo-completo-qa.test.mjs \
            tests/uki-romo-panel-control-qa.test.mjs \
            tests/uki-romo-panel-mismo-boton-qa.test.mjs \
            tests/uki-romo-firestore-aislamiento-qa.test.mjs \
            tests/uki-romo-script-navegador-qa.test.cjs \
            tests/uki-locales-configuracion-qa.test.cjs \
