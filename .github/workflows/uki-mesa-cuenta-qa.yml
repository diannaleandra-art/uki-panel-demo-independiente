name: Uki QR - aceptación aislada sin caja
on:
  push:
    branches:
      - preparacion/uki-panel-original-acceso-google-qa-2026-11-03
    paths:
      - 'tests/uki-qr-cuenta-browser.qa.cjs'
      - '.github/workflows/uki-mesa-cuenta-qa.yml'
      - 'firebase/uki-sushi-local.html'
      - 'firebase/uki-mesas-dispositivo-qa.js'
      - 'firebase/uki-mesas-cuenta-simulada.qa.mjs'
      - 'tests/uki-mesa-cuenta-simulada.qa.test.mjs'
      - 'tests/uki-qa-inline-js-check.cjs'
      - 'tests/uki-device-qr-browser.qa.cjs'
      - 'tests/uki-qr-sync.qa.mjs'
      - 'firebase/uki-cifrado-bloques.js'
      - 'firebase/uki-sushi-nube.js'
      - 'firebase/uki-particion-local.js'
      - 'firebase/uki-sushi-autoguardado.js'
      - 'tests/uki-qr-firestore-emulator.qa.mjs'
      - 'tests/uki-firestore-guest-read.qa.cjs'
      - 'tests/uki-firebase-guest-probe.qa.html'
      - 'tests/uki-firestore-emulator.rules'
      - 'firebase-qa-emulator.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mesa-cuenta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Código de prueba
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador aislado
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir SOLO archivos de esta rama, en localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/uki-qa-http.log 2>&1 &
          echo $! > /tmp/uki-qa-http.pid
      - name: Validar JavaScript del equipo QR privado
        run: node --check firebase/uki-mesas-dispositivo-qa.js
      - name: Probar cuenta y rondas de mesa en memoria, sin caja
        run: node --test tests/uki-mesa-cuenta-simulada.qa.test.mjs
      - name: Comprobar sintaxis del módulo integrado en el HTML QA
        run: node tests/uki-qa-inline-js-check.cjs
      - name: Probar botones reales del panel y guardar cuenta en sesión temporal
        run: node tests/uki-qr-cuenta-browser.qa.cjs
      - name: Probar firma y vínculo del equipo QR en Chromium sin red de producción
        run: node --test tests/uki-device-qr-browser.qa.cjs
      - name: Probar sincronización cifrada y autoguardado en nube simulada aislada
        run: node tests/uki-qr-sync.qa.mjs
      - name: Verificar lectura anónima prohibida en Firebase real (solo GET)
        run: node tests/uki-firestore-guest-read.qa.cjs

  firestore-emulador-aislado:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Código privado de pruebas
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java para Firebase Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dependencias exclusivas de la prueba aislada
        run: npm install --no-save --no-package-lock firebase-tools@14.22.0 @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
      - name: Comprobar escritura, recuperación y permisos con Firestore local
        run: npx firebase emulators:exec --only firestore --project demo-uki-mesas-qa-aislado --config firebase-qa-emulator.json "node tests/uki-qr-firestore-emulator.qa.mjs"
