name: Uki - agenda mensual segura
on:
  push:
    branches: [integracion/uki-respaldo-mensual-pendientes-20261121]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --check firebase/uki-archivo-mensual-panel.js
      - run: node --test tests/uki-agenda-respaldo-uki.test.cjs
