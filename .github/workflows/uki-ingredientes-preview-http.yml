name: Uki ingredientes · receptor QA HTTP seguro
on:
  push:
    branches: [feature/uki-ingredientes-armado-integracion-completa-2026-11-07]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/uki-ingredientes-armado-preview-http.test.cjs
