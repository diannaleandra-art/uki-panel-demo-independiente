name: Uki · no duplicar pedidos manuales y automáticos (QA)
on:
  push:
    branches:
      - feature/uki-evitar-duplicados-carta-manual-2026-11-07
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/uki-duplicados-carta-manual-20261107.test.cjs tests/uki-reserva-central-panel-20261107.test.cjs
