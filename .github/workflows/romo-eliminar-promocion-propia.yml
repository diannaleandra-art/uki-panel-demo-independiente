name: Romo eliminación de promociones propias
on:
  pull_request:
    branches: [release/romos-panel-v816]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --check public/romo-panel-qa/romo-carta-gestion-completa-qa.js
      - run: node --test tests/romo-eliminar-promocion-propia.test.cjs tests/romo-carta-ui-publicacion-clara.test.cjs tests/romo-carta-administracion-qa.test.cjs
