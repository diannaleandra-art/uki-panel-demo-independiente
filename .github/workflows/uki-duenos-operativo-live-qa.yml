name: Uki dueños · caja protegida y cierres seguros
on:
  push:
    branches:
      - qa/uki-duenos-operativo-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          node --check firebase/uki-duenos-cierre-publicador-live.mjs
          node --test tests/uki-duenos-operativo-live-20261110.test.cjs
