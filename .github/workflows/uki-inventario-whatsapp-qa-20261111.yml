name: "Uki Inventario · PDF y compras WhatsApp · QA"
on:
  pull_request:
    branches: [main]
    paths:
      - "firebase/uki-inventario-turno.html"
      - "public/index.html"
      - "firebase/uki-inventario-exportar.js"
      - "public/uki-inventario-exportar.js"
      - "tests/uki-inventario-pdf-lista-compras-whatsapp-20261111.test.cjs"
      - "tests/uki-inventario-diferencias-reponer-20261111.test.cjs"
      - ".github/workflows/uki-inventario-whatsapp-qa-20261111.yml"
permissions:
  contents: read
jobs:
  envios:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Comprobar PDF y texto de compras separados
        run: |
          node --test tests/uki-inventario-pdf-lista-compras-whatsapp-20261111.test.cjs tests/uki-inventario-informe-ordenado.test.cjs tests/uki-inventario-diferencias-reponer-20261111.test.cjs
