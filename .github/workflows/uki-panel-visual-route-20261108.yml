name: Uki panel · validar ruta visual segura del panel
on:
  push:
    branches:
      - release/uki-lote-unico-panel-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/uki-panel-visual-route-20261108.test.cjs
      - run: node --test tests/uki-timbres-cliente-identidad-20261108.test.cjs tests/uki-archivo-rechazados-cierre-claro-20261108.test.cjs tests/uki-delivery-manual-caja-20261108.test.cjs tests/uki-duplicados-carta-manual-20261107.test.cjs tests/uki-reserva-central-panel-20261107.test.cjs
