name: Uki dueños QA · cierres cifrados solo lectura
on:
  push:
    branches:
      - qa/uki-duenos-conexion-cierres-solo-lectura-20261109
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verificar módulos del lector privado
        run: |
          node --check firebase/uki-duenos-resumen-cierres.mjs
          node --check firebase/uki-sushi-nube.js
      - name: Probar cierres, sucursales, deduplicación y seguridad
        run: node --test tests/uki-duenos-resumen-cierres-qa-20261109.test.cjs
