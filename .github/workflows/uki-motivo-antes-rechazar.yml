name: Uki motivo antes de rechazar - QA
on:
  push:
    branches: [feature/uki-motivo-antes-rechazar-2026-11-07]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/uki-motivo-antes-rechazar.test.cjs
