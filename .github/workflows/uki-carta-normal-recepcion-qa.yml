name: Uki carta normal a panel - QA
on:
  push:
    branches: [feature/uki-carta-normal-recepcion-panel-qa-2026-11-07]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/uki-carta-normal-recepcion.test.cjs
      - name: Verificar receptor de carta en Vercel sin consultar datos de clientes
        run: |
          node --input-type=module -e 'const r=await fetch("https://uki-sushi-pedidos.vercel.app/api/carta-solicitudes-live?branch=serena",{signal:AbortSignal.timeout(15000)});const j=await r.json();if(r.status!==403||j.error!=="Personal no autorizado")throw Error("Receptor no listo: HTTP "+r.status+" "+String(j.error||""));console.log("Receptor activo y protegido: HTTP 403 sin credenciales")'

