name: Uki carta normal a panel - QA
on:
  push:
    branches: [feature/uki-carta-normal-recepcion-panel-qa-2026-11-07]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/uki-carta-normal-recepcion.test.cjs
      - name: Verificar carta y comparar recepción QR antigua y nueva sin credenciales
        run: |
          node --input-type=module -e 'const base="https://uki-sushi-pedidos.vercel.app";const old="https://uki-sushi-pedidos-cs1kocwd7-diannaleandra-7046.vercel.app";const get=async(url)=>{const r=await fetch(url,{signal:AbortSignal.timeout(15000)});return {status:r.status,body:await r.json().catch(()=>({}))}};const carta=await get(base+"/api/carta-solicitudes-live?branch=serena");if(carta.status!==403||carta.body.error!=="Personal no autorizado")throw Error("La carta debe permanecer protegida: "+carta.status);const antes=await get(old+"/api/mesa-pedidos-live?branch=serena");const ahora=await get(base+"/api/mesa-pedidos-live?branch=serena");console.log("QR anterior:",antes.status,"QR actual:",ahora.status);if(antes.status===403&&ahora.status!==403)throw Error("Regresión de QR: antes habilitado, ahora "+ahora.status);console.log("Carta activa y protegida, sin regresión en QR")'
