name: Romo en selector real del panel Uki - QA sin ventas
on:
  push:
    branches:
      - qa/romo-carta-vista-selector-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integracion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Revisar sintaxis módulos QA y selector único
        run: |
          node --check api/romo-duenos-vinculo-qa.js
          node --check lib/romo-duenos-vinculo-qa.mjs
          node --check firebase/uki-romo-vinculo-duenos-qa.mjs
          node --check lib/romo-duenos-alta-qa.mjs
          node --check api/romo-duenos-alta-qa.js
          node --check lib/romo-claves-lectura-servidor-qa.mjs
          node --check api/romo-claves-lectura-qa.js
          node --check lib/uki-local-router-qa.mjs
          node --check lib/romo-almacenamiento-operativo-panel-qa.mjs
          node --check lib/romo-almacenamiento-catalogo-panel-qa.mjs
          node --check lib/romo-almacenamiento-inventario-panel-qa.mjs
          node --check lib/romo-almacenamiento-unico-panel-qa.mjs
          node --check lib/romo-inventario-integracion-qa.mjs
          node --check lib/romo-inventario-modelo-qa.mjs
          node --check lib/romo-panel-carta-interfaz-qa.mjs
          node --check firebase/uki-romo-consulta-qa.mjs
          node --check lib/romo-claves-alta-qa.mjs
          node --check api/romo-claves-alta-qa.js
          node --check api/romo-carta-publica-qa.js
          node --check api/romo-solicitudes-carta-qa.js
          node --check lib/romo-solicitudes-carta-qa.mjs
          node --check lib/romo-reservas-carta-qa.mjs
          node --check firebase/uki-romo-solicitudes-panel-qa.mjs
          node --check firebase/uki-romo-alta-clave-qa.mjs
          node --check api/romo-estado-operativo-qa.js
          node --check lib/romo-comprobante-guardado-qa.mjs
          node --check firebase/uki-romo-operativo-qa.mjs
          node --check firebase/uki-romo-guardar-confirmar-qa.mjs
          node --check firebase/uki-romo-sesion-nube-qa.mjs
          node --check firebase/uki-romo-carta-selector-qa.mjs
          node --check firebase/romo-carta-qa/romo-carta-vista-embebida-qa.mjs
          node --check firebase/romo-carta-qa/romo-editor-carta-compatibilidad-qa.mjs
      - name: Preparar DOM simulado para la regresión del editor existente
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@24.1.3
      - name: Integración Romo y regresión de Uki
        run: |
          node --test \
            tests/romo-duenos-alta-qa.test.mjs \
            tests/romo-duenos-vinculo-qa.test.mjs \
            tests/uki-romo-vinculo-duenos-qa.test.mjs \
            tests/romo-claves-existentes-enrolamiento-qa.test.mjs \
            tests/romo-claves-lectura-servidor-qa.test.mjs \
            tests/romo-claves-lectura-api-cerrada-qa.test.mjs \
            tests/romo-almacenamiento-catalogo-panel-qa.test.mjs \
            tests/romo-almacenamiento-inventario-panel-qa.test.mjs \
            tests/romo-almacenamiento-unico-panel-qa.test.mjs \
            tests/romo-panel-http-qa.test.mjs \
            tests/romo-consulta-panel-qa.test.mjs \
            tests/romo-api-lector-solo-qa.test.mjs \
            tests/romo-alta-clave-qa.test.mjs \
            tests/romo-carta-publica-endpoint-qa.test.mjs \
            tests/romo-solicitudes-carta-qa.test.mjs \
            tests/romo-reservas-carta-qa.test.mjs \
            tests/romo-comprobante-guardado-qa.test.mjs \
            tests/romo-guardar-y-enlazar-pedido-qa.test.mjs \
            tests/romo-guardar-confirmar-flujo-qa.test.mjs \
            tests/romo-sesion-nube-panel-qa.test.mjs \
            tests/uki-romo-solicitudes-panel-qa.test.mjs \
            tests/romo-carga-catalogo-existente-20261112.test.mjs \
            tests/romo-almacenamiento-operativo-panel-qa.test.mjs \
            tests/uki-local-router-qa.test.mjs \
            tests/uki-romo-carta-selector-movil-qa-20261112.test.mjs \
            tests/uki-panel-unico-romo-serena-qa.test.cjs \
            tests/uki-romo-ingreso-clave-qa.test.cjs \
            tests/uki-romo-clave-remota-qa.test.cjs \
            tests/uki-admin-panel-dom.test.cjs

  visual-iphone:
    needs: integracion
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preparar navegador aislado
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Verificar vista Romo a ancho de iPhone y retorno seguro a Uki
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/romo-qa-http.log 2>&1 &
          node tests/uki-romo-browser-iphone-qa-20261112.mjs
      - name: Guardar captura sólo de la vista QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: romo-panel-carta-iphone-qa
          path: qa-artifacts/romo-carta-iphone-390.png
          if-no-files-found: ignore
          retention-days: 7
