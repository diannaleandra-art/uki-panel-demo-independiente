name: Uki QA lote mejoras del panel
on:
  push:
    branches:
      - release/uki-mejoras-lote-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Sintaxis, timbres, búsquedas, rechazos y entregas
        run: node --test tests/uki-lote-mejoras-20261108.test.cjs tests/uki-archivo-rechazados-cierre-claro-20261108.test.cjs tests/uki-timbres-cliente-identidad-20261108.test.cjs tests/uki-carta-precios-live.test.cjs tests/uki-carta-precios-integracion.test.cjs tests/uki-duplicados-carta-manual-20261107.test.cjs
