name: Uki dos sucursales - retencion compartida sin borrar
on:
  push:
    branches: [integracion/archivo-mensual-oficial-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --check firebase/uki-archivo-mensual-panel.js
      - run: node --test tests/uki-retencion-simulacion.test.cjs tests/uki-archivo-mensual-seguro.test.cjs
