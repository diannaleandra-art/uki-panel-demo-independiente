name: Uki QR - confirmación segura (QA)
on:
  push:
    branches:
      - preparacion/mesas-borradores-qr-sin-produccion-2026-11-03
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar que no confirma ni duplica antes de guardar
        run: node --test tests/uki-mesas-autoconfirmar.test.cjs tests/uki-qr-huella-nube.test.cjs
      - name: Validar sintaxis de la interfaz QR sin publicar
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('firebase/uki-sushi-local.html','utf8');
          const scripts = [...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1)throw Error('Se esperaba un módulo en el panel Uki');
          fs.writeFileSync('/tmp/uki-qr-panel.mjs',scripts[0][1]);
          NODE
          node --check /tmp/uki-qr-panel.mjs
