name: Uki inventario LIVE - pruebas aisladas
on:
  push:
    branches:
      - integracion/inventario-live-aislado-2026-11-06
      - integracion/inventario-admin-en-panel-operativo-2026-11-06
      - feature/uki-disponibilidad-manual-live-2026-11-06
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check firebase/uki-inventario-admin-embebido.js
      - run: npm test
      - run: node --test tests/uki-disponibilidad-live.test.cjs
      - run: node --test tests/inventario-admin-integrado.test.cjs
      - run: node --check firebase/uki-carta-precios-admin.js
      - run: node --check api/uki-carta-precios-live.js
      - run: node --test tests/uki-carta-precios-live.test.cjs
      - run: node --check firebase/uki-inventario-exportar.js
      - run: node --check firebase/uki-inventario-historial-admin.js
      - run: node --check api/inventario-turno-live.js
      - run: node --test tests/uki-inventario-historial.test.cjs
      - name: Instalar DOM de pruebas (no modifica dependencias de producción)
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - run: node --test tests/uki-admin-panel-dom.test.cjs

