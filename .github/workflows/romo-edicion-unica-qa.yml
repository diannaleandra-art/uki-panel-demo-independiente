    branches: [fix/romo-edicion-unica-como-uki-20261121]
  pull_request:
    branches: [release/romos-panel-v816]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/romo-edicion-unica-qa.test.cjs
