name: Uki cancelaciones v8.15 - QA aislada
on:
  pull_request:
    branches: [main]
    paths:
      - "firebase/uki-sushi-local.html"
      - "firebase/uki-sushi-nube.js"
      - "firebase/uki-sushi-autoguardado.js"
      - "firebase/uki-particion-local.js"
      - "firebase/uki-cifrado-bloques.js"
      - "firebase/tests/**"
      - ".github/workflows/uki-cancelaciones-qa.yml"
permissions:
  contents: read
jobs:
  seguridad-y-emulador:
    if: github.event.pull_request.head.ref == 'preparacion/cancelar-pedidos-locales-v815-2026-11-01'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Obtener rama QA sin credenciales
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Java para el emulador
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test unitario y cifrado AES-256-GCM sin red ni Firebase
        run: |
          node --test firebase/tests/cancelaciones-locales-v815.test.mjs firebase/tests/cancelaciones-cifrado-e2e.test.mjs
      - name: Instalar herramientas SOLO dentro del runner temporal
        run: npm install --no-save --no-audit --no-fund firebase@latest firebase-tools@latest
      - name: Crear reglas abiertas SOLO para emulador demo efímero
        run: |
          cat > "$RUNNER_TEMP/firestore-qa.rules" <<'RULES'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /{document=**} {
                allow read, write: if true;
              }
            }
          }
          RULES
          cat > "$RUNNER_TEMP/firebase-qa.json" <<EOF
          {
            "firestore":{"rules":"$RUNNER_TEMP/firestore-qa.rules"},
            "emulators":{
              "firestore":{"host":"127.0.0.1","port":8080},
              "ui":{"enabled":false}
            }
          }
          EOF
      - name: Integración SDK + Firestore emulador, proyecto demo sin producción
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
        run: |
          npx firebase emulators:exec --project demo-uki-cancelaciones-qa-2026 --config "$RUNNER_TEMP/firebase-qa.json" --only firestore 'node --test firebase/tests/cancelaciones-firestore-emulator.test.mjs'
