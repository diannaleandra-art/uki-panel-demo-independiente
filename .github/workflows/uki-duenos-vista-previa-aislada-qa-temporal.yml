name: Uki dueños · vista previa aislada QA
on:
  push:
    branches:
      - qa/uki-duenos-vista-previa-aislada-20261109
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validar sintaxis del lector privado
        run: |
          node --check firebase/uki-duenos-ventas-qa.mjs
          node --check firebase/uki-duenos-resumen-cierres.mjs
      - name: Seguridad y funciones sin modificar administración real
        run: node --test tests/uki-duenos-vista-previa-aislada-20261109.test.cjs
