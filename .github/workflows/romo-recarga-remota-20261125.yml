name: Romo - recarga remota segura
on:
  push:
    branches:
      - fix/romo-recarga-remota-validacion-20261125
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/romo-recarga-remota-20261125.test.mjs tests/romo-sesion-estado-confirmado-qa.test.mjs tests/romo-edicion-unica-qa.test.cjs tests/romo-caja-movimientos-paridad.test.mjs tests/romo-cierre-pedidos-previos-qa.test.mjs tests/romo-finanzas-cierres-sin-duplicar-qa.test.mjs tests/romo-paridad-cobros-qa.test.mjs tests/romo-pedidos-busqueda-paridad.test.mjs tests/seguimiento-romo-operativo-v1.test.cjs
