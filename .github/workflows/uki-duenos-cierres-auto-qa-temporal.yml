name: Uki dueños · cierre automático QA
on:
  push:
    branches:
      - qa/uki-duenos-cierres-auto-seguro-20261109
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Revisar sintaxis
        run: |
          node --check api/uki-duenos-cierres-auto-qa.js
          node --check firebase/uki-duenos-cierre-publicador-qa.mjs
      - name: Probar seguridad, idempotencia, jornadas y cifras
        run: node --test tests/uki-duenos-cierres-auto-qa-20261109.test.cjs
