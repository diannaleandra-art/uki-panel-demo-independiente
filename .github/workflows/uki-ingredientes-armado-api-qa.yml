name: Uki ingredientes de armado · API QA
on:
  push:
    branches:
      - feature/uki-ingredientes-armado-api-2026-11-07
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --check api/uki-ingredientes-armado-live.js
      - run: node --test tests/uki-ingredientes-armado-api.test.cjs
