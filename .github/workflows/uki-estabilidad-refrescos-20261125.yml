name: Uki - estabilidad de pedidos sin datos reales
on:
  push:
    branches:
      - fix/uki-regimiento-refrescos-20261125
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pruebas aisladas sin credenciales ni escrituras reales
        run: |
          node --test tests/uki-refrescos-sin-cambios-20261125.test.cjs tests/uki-cancelacion-no-cierra-refresco-20261109.test.cjs tests/uki-cancelar-estado-impago-20261109.test.cjs tests/uki-carta-aceptadas-canceladas-sin-alerta-20261109.test.cjs tests/uki-carta-normal-recepcion.test.cjs tests/uki-qr-huella-nube.test.cjs tests/uki-mesas-autoconfirmar.test.cjs tests/uki-qr-cancelacion-mesa.test.cjs
